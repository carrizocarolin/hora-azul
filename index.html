<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hora Azul - Mantenimiento</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #020617, #0f1b3d, #312e81);
      color: #f5f3ff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    .box {
      padding: 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(5,10,24,.75);
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 3rem;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0;
      opacity: .7;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>503</h1>
    <p>Hora Azul está temporalmente en mantenimiento.</p>
  </div>
</body>
</html>
